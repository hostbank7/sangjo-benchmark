<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동행매치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: two-sided request marketplace — sticky header with customer/partner switch; request form with live price floor; partner request board; chat thread with masked contacts; ranking table */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#e9eeec; --line:#d6dedb;
  --fg:#18211f; --mute:#58655f; --accent:#1e5b4c; --accent-fg:#ffffff; --accent-soft:#dcebe5;
  --urgent:#b3402e; --urgent-soft:#f6e1dc; --star:#a87a1e; --ok:#2f7a4f; --warn:#94650f; --warn-soft:#f6ecd6;
  --me:#1e5b4c; --me-fg:#ffffff;
  --display:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201d; --sunk:#202a26; --line:#2e3a36;
  --fg:#e7eeeb; --mute:#9aa9a3; --accent:#6fc2a6; --accent-fg:#0d1614; --accent-soft:#1f3a31;
  --urgent:#ec8a76; --urgent-soft:#3a221d; --star:#e0b45a; --ok:#7fcf9c; --warn:#e3b45c; --warn-soft:#3a2f18;
  --me:#2c6e5c; --me-fg:#f0f7f4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201d; --sunk:#202a26; --line:#2e3a36;
  --fg:#e7eeeb; --mute:#9aa9a3; --accent:#6fc2a6; --accent-fg:#0d1614; --accent-soft:#1f3a31;
  --urgent:#ec8a76; --urgent-soft:#3a221d; --star:#e0b45a; --ok:#7fcf9c; --warn:#e3b45c; --warn-soft:#3a2f18;
  --me:#2c6e5c; --me-fg:#f0f7f4; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 15px/1.65 var(--body);word-break:keep-all;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);line-height:1.35;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,38px);font-weight:700}
h2{font-size:clamp(19px,2.5vw,24px);font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);
  padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.u{background:var(--urgent-soft);color:var(--urgent)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.n{background:var(--sunk);color:var(--mute)}
.label{font-size:12px;letter-spacing:.06em;color:var(--mute);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}

/* header */
.notice{background:var(--accent);color:var(--accent-fg);font-size:13px;text-align:center;padding:7px 8px;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.logo{font-family:var(--display);font-weight:700;font-size:20px;text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.navl{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.navl a{text-decoration:none;padding:7px 10px;font-size:14px;font-weight:500;border-radius:6px;white-space:nowrap}
.navl a:hover{background:var(--sunk)}
.navl a.on{color:var(--accent);font-weight:700}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;padding-block:34px 24px;align-items:center}
.hero>*{min-width:0}
.hero .lead{margin-top:12px;color:var(--mute);max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.example{display:grid;gap:10px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px 16px}
.bubble.r{border-radius:14px 14px 4px 14px;background:var(--accent-soft);border-color:transparent;margin-left:28px}
.bubble b{font-family:var(--display)}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:0;margin:0;counter-reset:s}
.flow li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;counter-increment:s;font-size:14px}
.flow li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:12px;margin-bottom:8px}
.flow b{display:block;font-family:var(--display);margin-bottom:2px}
section.blk{padding-block:30px 6px}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.free{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.free div{background:var(--surface);padding:16px 18px}
.free b{display:block;font-family:var(--display);font-size:22px;color:var(--accent)}
.free span{font-size:13px;color:var(--mute)}

/* request cards */
.reqs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.req .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.req .price{font-family:var(--display);font-size:20px;font-weight:700}
.req .conds{display:flex;flex-wrap:wrap;gap:4px}
.req .memo{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.req .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

/* form */
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start;padding-block:24px 40px}
.fs{border:0;padding:0;margin:0 0 22px;display:grid;gap:8px}
.fs legend{font-family:var(--display);font-weight:600;font-size:15px;margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opts span{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px;background:var(--surface);cursor:pointer}
.opts input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opts input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.opts small{color:var(--mute);font-size:12px;margin-left:4px}
select,input.txt,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai{background:var(--accent-soft);border-radius:12px;padding:16px;display:grid;gap:10px;margin-bottom:22px}
.ai .out{font-size:14px;background:var(--surface);border-radius:8px;padding:10px 12px}
.money{display:flex;align-items:center;gap:8px}
.money input{max-width:180px;font-family:var(--display);font-size:20px;font-weight:700;text-align:right}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:grid;gap:12px}
.floor{display:grid;gap:6px}
.floor .v{font-family:var(--display);font-size:24px;font-weight:700}
.meter{height:8px;border-radius:4px;background:var(--sunk);position:relative;margin-top:6px}
.meter i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--fg)}
.meter span{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-radius:4px}
.err{color:var(--urgent);font-size:13px;font-weight:500}
.okm{color:var(--ok);font-size:13px;font-weight:500}
.brk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}

/* my / chat */
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start;padding-block:24px 40px}
.offer{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;background:var(--surface)}
.offer .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.offer .p{font-family:var(--display);font-size:20px;font-weight:700}
.offer ul{margin:0;padding-left:18px;font-size:13px;color:var(--mute)}
.waiting{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mute);font-size:14px}
.chat{display:grid;grid-template-rows:auto 1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:520px}
.chat .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.msgs{padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:56vh;background:var(--bg)}
.m{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--me);color:var(--me-fg);border-color:transparent}
.m.sys{align-self:center;max-width:92%;background:var(--warn-soft);color:var(--warn);border:0;font-size:12px;text-align:center}
.m .who{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
.send{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.send input{flex:1;min-width:0}
.contract{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.contract dt{color:var(--mute)}
.contract dd{margin:0}
.timeline{display:grid;gap:0;padding:0;margin:0}
.timeline li{list-style:none;display:grid;grid-template-columns:22px 1fr;gap:10px;padding-bottom:14px;position:relative}
.timeline li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:4px}
.timeline li.done::before{background:var(--accent);border-color:var(--accent)}
.timeline li.cur::before{border-color:var(--accent);border-width:4px}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:6px;top:20px;bottom:0;width:2px;background:var(--line)}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:36px;height:32px;cursor:pointer;font-size:13px}
.stars button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.q{display:grid;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}

/* ranking */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:12px;color:var(--mute);background:var(--sunk)}
td:nth-child(-n+2),th:nth-child(-n+2){text-align:left}
tr:last-child td{border-bottom:0}
.rk{font-family:var(--display);font-weight:700;font-size:18px}
.tot{font-family:var(--display);font-weight:700;font-size:17px;color:var(--accent)}
.weights{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.weights div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.weights b{display:block;font-family:var(--display);font-size:20px}
.weights span{font-size:12px;color:var(--mute)}

/* join */
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0;margin:0;counter-reset:r}
.rules li{list-style:none;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);font-size:14px;counter-increment:r}
.rules li::before{content:counter(r) "회";display:block;font-family:var(--display);font-weight:700;color:var(--urgent)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:24px;display:grid;gap:12px;max-height:90vh;overflow:auto}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:50;font-size:14px;max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--line);margin-top:30px;padding-block:22px 36px;font-size:13px;color:var(--mute);display:grid;gap:4px}

@media (max-width:960px){
  .reqs{grid-template-columns:1fr 1fr} .flow{grid-template-columns:repeat(3,1fr)}
  .formgrid,.two{grid-template-columns:1fr} .side{position:static}
  .weights{grid-template-columns:repeat(3,1fr)} .rules{grid-template-columns:1fr 1fr}
}
@media (max-width:680px){
  .hero{grid-template-columns:1fr} .reqs{grid-template-columns:1fr} .flow{grid-template-columns:1fr 1fr}
  .free{grid-template-columns:1fr} .row2{grid-template-columns:1fr} .weights{grid-template-columns:1fr 1fr}
  .navl{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .m{max-width:90%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="notice">오픈 기념 12개월 전면 무료 · 고객 가입, 업체 입점, 매칭 수수료 모두 0원</div>
<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#home"><i aria-hidden="true"></i>동행매치</a>
    <div class="seg" role="group" aria-label="화면 전환">
      <button type="button" data-role="customer" aria-pressed="true">고객</button>
      <button type="button" data-role="partner" aria-pressed="false">상조회사</button>
    </div>
    <nav class="navl" id="nav" aria-label="주요 메뉴"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap">
  <p>동행매치는 서울·경기·인천 지역의 후불제 상조 매칭 시연 화면입니다. 업체, 요청, 점수, 전화번호는 모두 예시이며 실제로 전송되지 않습니다.</p>
  <p>매칭 확정 전 연락은 사이트 채팅과 050 안심번호로만 가능합니다. 장례식장 이용료, 화장장 이용료는 상조 비용과 별도입니다.</p>
</footer>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const man=n=>Number(n).toLocaleString('ko-KR')+'만원';

/* ---------- 선택지와 최소 금액 기준 (예시 기준) ---------- */
const SIDO={'서울':['강남구','강서구','관악구','노원구','마포구','송파구','은평구','종로구'],'경기':['고양시','부천시','성남시','수원시','안산시','용인시','의정부시','화성시'],'인천':['남동구','미추홀구','부평구','서구','연수구','계양구']};
const F={
 timing:{t:'언제 필요하세요?',o:{urgent:'임종 직후 (긴급)',soon:'임종이 임박했어요',plan:'미리 준비해요'}},
 type:{t:'장례 형태',o:{home:'자택장 (주택장)',nobinso:'무빈소장',oneday:'1일장',family:'가족장 2일장',general:'일반 3일장'}},
 place:{t:'장례 장소',o:{home:'자택',hospital:'병원 장례식장',hall:'전문 장례식장',church:'종교시설'}},
 religion:{t:'종교',o:{none:'무교',christian:'기독교',catholic:'천주교',buddhist:'불교'}},
 guests:{t:'예상 조문객',o:{g0:'가족만 (20명 이하)',g1:'50명 이하',g2:'50~150명',g3:'150명 이상'}},
 burial:{t:'장법',o:{charnel:'화장 후 봉안당',nature:'수목장·자연장',sea:'해양장',grave:'매장',undecided:'아직 미정'}},
 director:{t:'장례지도사',o:{d1:'1명',d2:'2명'}},
 helpers:{t:'의전도우미 (8시간 기준)',o:{h0:'필요 없음',h2:'2명',h4:'4명',h6:'6명'}},
 goods:{t:'관·수의·유골함 등급',o:{low:'실속 (하)',mid:'표준 (중)',high:'고급 (상)',own:'직접 준비'}},
 cars:{t:'차량 (운구 앰뷸런스 기본 포함)',multi:true,o:{limo:'리무진',bus:'장의 버스'}},
 extras:{t:'추가 서비스',multi:true,o:{video:'추모 영상',concert:'추모 공연',admin:'사후 행정 대행',cleanup:'유품 정리'}},
};
const BASE={home:45,nobinso:70,oneday:100,family:150,general:220};
const ADD={d2:30,h0:0,h2:16,h4:32,h6:48,low:0,mid:30,high:80,own:-15,limo:25,bus:35,video:20,concert:50,admin:15,cleanup:80};
function floorOf(r){
  const parts=[[`${F.type.o[r.type]} 기본`,BASE[r.type]]];
  if(r.director==='d2') parts.push(['장례지도사 추가 1명',ADD.d2]);
  if(r.helpers!=='h0') parts.push([`의전도우미 ${F.helpers.o[r.helpers]}`,ADD[r.helpers]]);
  if(r.goods!=='low') parts.push([`용품 ${F.goods.o[r.goods]}`,ADD[r.goods]]);
  (r.cars||[]).forEach(c=>parts.push([F.cars.o[c],ADD[c]]));
  (r.extras||[]).forEach(c=>parts.push([F.extras.o[c],ADD[c]]));
  if(r.type==='general'&&r.guests==='g3') parts.push(['대규모 조문 운영',20]);
  const min=Math.max(Math.round(BASE[r.type]*0.8),parts.reduce((a,p)=>a+p[1],0));
  const r5=x=>Math.round(x/5)*5;
  return {min,lo:r5(min*1.15),hi:r5(min*1.6),parts};
}

}

  return `<section class="blk"><div class="sechead"><h1 style="font-size:clamp(22px,3vw,28px)">내 제안·채팅</h1><span class="chip">${partner.name}</span></div>

    <div class="price num">${man(o.price)} <span class="small mute" style="font-weight:400">제안</span></div><div class="conds">${condChips(r)}</div>
    <div class="foot"><span>${r.who}님 · 메시지 ${o.msgs.length}개</span><a class="btn sm" href="#chat-${o.id}">채팅 열기</a></div></article>`}).join('')||'<div class="waiting">아직 보낸 제안이 없어요. 요청 게시판에서 제안을 보내 보세요.</div>'}</div></section>`;
}

/* ---------- 순위 ---------- */
function vRanking(){
  const rows=[...C].sort((a,b)=>(score(b)??-1)-(score(a)??-1));
  return `<section class="blk">
    <div class="sechead"><div><span class="label">서울 · 경기 · 인천</span><h1 style="font-size:clamp(22px,3vw,28px);margin-top:4px">업체 순위</h1></div><span class="mute small">매칭 완료 건만 반영됩니다</span></div>
    <div class="weights num" style="margin-bottom:16px">
      <div><b>40%</b><span>해피콜 만족도 (상담사가 직접 전화로 조사)</span></div>
      <div><b>25%</b><span>인증 리뷰 (매칭 확정 고객만 작성)</span></div>
      <div><b>15%</b><span>견적 대비 정산 일치</span></div>
      <div><b>10%</b><span>요청에 첫 제안까지 걸린 시간</span></div>
      <div><b>-5점</b><span>직거래 유도 경고 1회당</span></div>
    </div>
    <div class="tblwrap"><table class="num"><thead><tr><th>순위</th><th>업체</th><th>해피콜</th><th>리뷰</th><th>정산 일치</th><th>응답 속도</th><th>매칭 건수</th><th>경고</th><th>종합</th></tr></thead><tbody>
    ${rows.map((c,i)=>{const s=score(c);return `<tr><td class="rk">${s===null?'-':i+1}</td><td><b>${c.name}</b><br><span class="small mute">${c.area}</span></td>
      ${s===null?'<td colspan="3" style="text-align:center"><span class="chip">신규 파트너 · 첫 5건 동안 기본 노출</span></td>':`<td>${c.happy}</td><td>${c.review}</td><td>${c.match}</td>`}
      <td>${c.speed}</td><td>${c.done}</td><td>${c.warn?`<span class="chip u">${c.warn}회</span>`:'-'}</td><td class="tot">${s??'-'}</td></tr>`}).join('')}
    </tbody></table></div>
    <p class="small mute" style="margin-top:10px">순위 기준은 입점 업체와 고객 모두에게 공개합니다. 매칭 건수가 20건 미만이면 건수에 따라 가산점이 줄어듭니다.</p>
  </section>`;
}

/* ---------- 업체: 입점 ---------- */
function vJoin(){
  return `<div class="formgrid"><form class="panel" id="joinForm">
    <span class="label">오픈 기념 12개월 무료</span><h1 style="font-size:clamp(22px,3vw,28px);margin-top:4px">상조회사 무료 입점 신청</h1>
    <p class="mute small" style="margin:4px 0 18px">입점, 요청 열람, 제안 발송, 매칭 수수료가 모두 무료입니다. 무료 기간이 끝나면 매칭이 성사된 건에만 수수료가 생기며, 30일 전에 미리 안내합니다.</p>
    <div style="display:grid;gap:12px">
    <div class="row2"><div><label class="small" for="jName">상호</label><input class="txt" id="jName" placeholder="예) 동행후불상조"></div>
      <div><label class="small" for="jBiz">사업자등록번호</label><input class="txt" id="jBiz" placeholder="000-00-00000" inputmode="numeric"></div></div>
    <fieldset class="fs"><legend>활동 지역</legend><div class="opts">${['서울 전역','서울 동부','서울 서부','경기 북부','경기 남부','인천'].map(a=>`<label><input type="checkbox" name="area" value="${a}"><span>${a}</span></label>`).join('')}</div></fieldset>
    <div class="row2"><div><label class="small" for="jDir">장례지도사 인원</label><input class="txt" id="jDir" inputmode="numeric" placeholder="명"></div>
      <div><label class="small" for="jHelp">의전도우미 인원</label><input class="txt" id="jHelp" inputmode="numeric" placeholder="명"></div></div>
    <fieldset class="fs"><legend>제출 서류</legend><div class="opts">
      <label><input type="checkbox" checked><span>사업자등록증</span></label><label><input type="checkbox" checked><span>장례지도사 자격증</span></label><label><input type="checkbox" checked><span>배상책임보험 증권</span></label></div>
      <p class="small mute">서류 파일은 심사 담당자가 연락드려 받습니다. 심사는 보통 3일 안에 끝납니다.</p></fieldset>
    <label class="check"><input type="checkbox" id="jAgree"> <span>[필수] 매칭 확정 전 직접 연락 금지와 단계별 제재 규정에 동의합니다.</span></label>
    <button class="btn block" type="submit">무료 입점 신청하기</button></div></form>
    <aside class="side"><div class="panel" style="display:grid;gap:10px"><h3>창립 파트너 혜택</h3>
      <p class="small">오픈 후 6개월 안에 입점한 업체는 유료 전환 후에도 수수료 할인과 창립 파트너 배지를 받습니다.</p></div>
      <div class="panel" style="display:grid;gap:10px"><h3>직거래 유도 제재 기준</h3>
      <ol class="rules" style="grid-template-columns:1fr 1fr"><li>경고와 점수 5점 감점</li><li>30일 노출 제한</li><li>90일 제안 정지</li><li>입점 해지</li></ol>
      <p class="small mute">모든 단계에서 소명 기회를 드립니다. 매칭 확정 후 장례 진행 중 통화는 제재 대상이 아닙니다.</p></div></aside></div>`;
}

/* ---------- 라우팅 ---------- */
function route(){
  const h=location.hash.slice(1)||(role==='customer'?'home':'board');
  const app=$('#app'); let html;
  if(h.startsWith('chat-')) html=vChat(+h.slice(5));
  else html=({home:vHome,request:vRequest,my:vMy,board:vBoard,ptalk:vPtalk,ranking:vRanking,join:vJoin}[h]||vHome)();
  const keep=h===route.last; route.last=h;
  app.innerHTML=html; renderNav();
  if(h==='request'){updateFloor()}
  const ms=$('#msgs'); if(ms) ms.scrollTop=ms.scrollHeight;
  if(!keep) window.scrollTo(0,0);
  if(h.startsWith('chat-')&&keep){const i=$('#msgIn'); i&&i.focus()}
}
function setRole(r){role=r; location.hash=r==='customer'?'home':'board'; route()}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  const d=t.dataset;
  if(d.role){e.preventDefault();setRole(d.role);return}
  if(t.hasAttribute('data-close')){$('#modal').hidden=true;return}
  if(t.id==='aiBtn'){readForm(); const txt=$('#aiText').value.trim(); if(!txt){toast('먼저 원하는 장례를 말로 적어 주세요.');return}
    const {d:nd,got,ask}=aiParse(txt); const memo=$('#memo').value||txt; draft={...nd,memo};
    route(); $('#aiText').value=txt; const out=$('#aiOut'); out.hidden=false;
    out.innerHTML=`<b>이렇게 정리했어요.</b> ${got.map(esc).join(', ')||'인식한 조건이 없어요'}${ask.length?`<br><span class="mute">아래에서 직접 골라 주세요: ${ask.join(', ')}</span>`:''}`; return}
  if(d.propose){proposeModal(+d.propose);return}
  if(d.bf){boardFilter=d.bf;route();return}
  if(d.call){call050(allOffers().find(o=>o.id===+d.call));return}
  if(d.match){confirmMatch(allOffers().find(o=>o.id===+d.match));return}
  if(d.domatch){const o=allOffers().find(x=>x.id===+d.domatch), r=RIDX()[o.rid]; o.status='matched'; r.status='matched'; r.stage=2;
    o.msgs.push({from:'sys',text:'매칭이 확정되었어요. 확정 견적서가 만들어졌고, 050 안심번호는 정산이 끝날 때까지 유지됩니다.'});
    $('#modal').hidden=true; toast('매칭을 확정했어요. 확정 견적서가 만들어졌습니다.'); route(); return}
  if(t.hasAttribute('data-advance')){myReq.stage=(myReq.stage||2)+1; route(); return}
  if(t.hasAttribute('data-happy')){happyCall();return}
  if(d.star!==undefined){t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if(d.reprice){const o=allOffers().find(x=>x.id===+d.reprice), r=RIDX()[o.rid], v=+$('#newPrice').value.replace(/[^0-9]/g,''), fl=floorOf(r);
    if(v<fl.min){toast(`최소 ${man(fl.min)} 이상으로만 바꿀 수 있어요.`);return}
    o.price=v; o.msgs.push({from:'sys',text:`업체가 제안 금액을 ${man(v)}으로 변경했어요.`}); route(); return}
});
document.addEventListener('change',e=>{
  if(!$('#reqForm')||!e.target.closest('#reqForm')) return;
  if(e.target.id==='sido'){draft.sido=e.target.value; draft.gu=SIDO[draft.sido][0]; readForm(); draft.gu=SIDO[draft.sido][0]; const s=window.scrollY; route(); window.scrollTo(0,s); return}
  if(e.target.name==='type'&&e.target.value==='home'){readForm(); Object.assign(draft,{place:'home',helpers:'h0'}); const s=window.scrollY; route(); window.scrollTo(0,s); return}
  readForm(); updateFloor();
});
document.addEventListener('input',e=>{ if(e.target.id==='budget'||e.target.id==='memo'){readForm(); updateFloor();} });
document.addEventListener('submit',e=>{
  if(e.target.id==='reqForm'){e.preventDefault(); readForm(); const fl=floorOf(draft); if(+draft.budget<fl.min){updateFloor();return}
    user?submitRequest():signup(submitRequest);}
  if(e.target.id==='sendForm'){e.preventDefault(); const v=$('#msgIn').value.trim(); if(!v) return; const o=allOffers().find(x=>x.id===+location.hash.slice(6)); sendMsg(o,v);}
  if(e.target.id==='joinForm'){e.preventDefault(); if(!$('#jAgree').checked){toast('제재 규정 동의가 필요해요.');return} toast('입점 신청을 받았어요. 심사 담당자가 3일 안에 연락드립니다. (시연)');}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal') e.currentTarget.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape') $('#modal').hidden=true});
window.addEventListener('hashchange',route);
if(['board','ptalk','join'].includes(location.hash.slice(1))) role='partner';
route();
})();
</script>

</html>

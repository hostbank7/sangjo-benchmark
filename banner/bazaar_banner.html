<style>

    -webkit-text-stroke:14px #fff;paint-order:stroke fill}
  #date .n{color:#1a6fe0}

<div class="t" id="top"><span class="h">♥</span>사랑과 나눔으로 함께하는 바자회에 많은 참여 부탁드립니다<span class="h">♥</span></div>
